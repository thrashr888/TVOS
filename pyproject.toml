[project]
name = "tvos"
version = "0.1.0"
description = "Temporal Vector OLAP System"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyzmq>=25.1.2",
    "protobuf>=5.29.0,<6.0.0",
    "duckdb>=0.10.0",
    "redis>=5.0.1",
    "weaviate-client>=4.5.4",
    "prometheus-client>=0.20.0",
    "fastapi>=0.109.2",
    "uvicorn>=0.27.1",
    "websockets>=12.0",
    "python-dotenv>=1.0.1",
    "sentence-transformers>=2.5.0",
    "hdbscan>=0.8.33",
    "psutil>=5.9.0",
    "scikit-learn>=1.4.0",
    "umap-learn>=0.5.5",
    "pyparsing>=3.1.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.4.0",
    "grpcio-tools>=1.62.0,<1.76.0",
    "cryptography>=41.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
